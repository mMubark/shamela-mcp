[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shamela-mcp"
version = "1.1.0"
description = "MCP server exposing the local Al-Maktaba Al-Shamela 4 library to Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamad Mubarak" }]
keywords = ["mcp", "shamela", "islamic", "arabic", "lucene"]

dependencies = [
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/mMubark/shamela-mcp"

[project.scripts]
shamela-mcp = "shamela_mcp.__main__:main"

[tool.setuptools]
packages = ["shamela_mcp", "shamela_mcp.tools"]
include-package-data = true

[tool.setuptools.package-data]
shamela_mcp = ["../java/shamela-mcp-helper.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real Shamela 4 installation (auto-skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are usually Arabic strings that must not be broken
    # install.py deliberately checks sys.version_info: it validates whichever
    # interpreter launched it, which may predate this project's minimum.
    "UP036",
]
